services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Flyway doesn't create databases, so create it once before migrating.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('FlywayDemo') IS NULL CREATE DATABASE FlywayDemo;"

  flyway:
    image: docker.io/redgate/flyway:latest
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD}
    command: -workingDirectory=project -connectRetries=10 migrate
    volumes:
      - ./flyway:/flyway/project

  api:
    build: ./src/Api
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: "Server=db;Database=FlywayDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  mssql-data:
